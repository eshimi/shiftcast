name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: D1 を用意（無ければ作成）
        run: ./scripts/ensure-d1.sh
      - name: マイグレーション適用
        run: npx wrangler d1 migrations apply DB --remote
      - name: デプロイ
        run: npx wrangler deploy
      - name: Secrets を反映（設定済みのものだけ）
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          for k in OPENWEATHER_API_KEY FIREBASE_SERVICE_ACCOUNT FIREBASE_WEB_CONFIG FIREBASE_VAPID_KEY; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler secret put "$k"; else echo "skip $k (未設定)"; fi
          done
